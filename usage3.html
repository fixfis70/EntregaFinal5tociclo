<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>

    <!-- ML5.js (ML) - Última versión -->
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <link rel="stylesheet" href="elCss.css">
</head>
<body>
<div id="root">
    <div>
        <h1>Caso 3</h1>
        <p>Detección partes del rosto. Utilizar la cámara, se debe poder seleccionar qué parte del rostro se desea detectar, además del color. Luego se deberá mostrar en tiempo real lo solicitado.</p>
    </div>
    <div style="width: 100%">
        <h1>Decteccion de la cara</h1>
        <p>Selecciona un color primero</p>
        <input type="color" id="color">
        <p>Selecciona que quieres capurar</p>
        <select id="select">
            <option value="leftEye">Ojo Izquierdo</option>
            <option value="leftEyebrow">Ceja Ojo Izquierdo</option>
            <option value="rightEye">Ojo Derecho</option>
            <option value="rightEyebrow">Ceja Ojo Derecho</option>
            <option value="faceOval">Silueta de la cara</option>
            <option value="lips">Labios</option>
            <option value="todo">Todo</option>
        </select>
        <!-- Puedes descomentar esto y conmentar lo de arriba para poder introducir los valores escribiendolos! -->
        <!--        <input type="text" id="select">-->
    </div>
</div>


<script>
    /*
     * 👋 Hello! This is an ml5.js example made and shared with ❤️.
     * Learn more about the ml5.js project: https://ml5js.org/
     * ml5.js license and Code of Conduct: https://github.com/ml5js/ml5-next-gen/blob/main/LICENSE.md
     *
     * This example demonstrates face tracking on live video through ml5.faceMesh.
     */

    let faceMesh;
    let video;
    let faces = [];
    let options = {maxFaces: 1, refineLandmarks: false, flipHorizontal: false};
    let part;
    let color;


    function preload() {
        // Load the faceMesh model
        faceMesh = ml5.faceMesh(options);
        const colorField = document.getElementById("color");
        colorField.addEventListener("change", function () {
            color = colorField.value;
            console.log(color);
        })
        const partField = document.getElementById("select");
        partField.addEventListener("change", function () {
            part = partField.value;
            console.log(part);
        })
    }

    function setup() {
        const canvas = createCanvas(640, 480);
        canvas.parent("root");
        // Create the webcam video and hide it
        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();
        // Start detecting faces from the webcam video
        faceMesh.detectStart(video, gotFaces);
    }

    function draw() {
        // Draw the webcam video
        image(video, 0, 0, width, height);

        // Draw all the tracked face points
        for (let i = 0; i < faces.length; i++) {
            let face = faces[i];
            //seleciona la parte
            let selectedPart = face[part]?.keypoints;
            // si es All entonces no seleccionamos una parte en concreta sino todo!
            if (part === "todo") selectedPart = face.keypoints;
            if (!selectedPart) return
            for (let j = 0; j < selectedPart.length; j++) {
                let keypoint = selectedPart[j];
                fill(color ?? 255);
                ellipse(keypoint.x, keypoint.y, 10, 10);
            }
        }
    }

    // Callback function for when faceMesh outputs data
    function gotFaces(results) {
        // Save the output to the faces variable
        faces = results;
        console.log(results);
    }

</script>
<script src="navbar.js"></script>
<script>
    whereAmI("case3");
</script>
</body>
</html>
