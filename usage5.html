<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>

    <!-- ML5.js (ML) - Última versión -->
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <link rel="stylesheet" href="elCss.css">
</head>
<body>
<div>
    <h1>Caso 5</h1>
    <p>Utilizando el detector de objetos de la librería ML5, emitir una alerta cuando detecte la presencia de una persona por más de 5 segundos. Se deberá mostrar una barra de desplazamiento durante el conteo, si llega a 5, la alarma se emite (sonora).</p>
</div>
<script>
    let video;
    let bodyPose;
    let poses = [];
    let connections;
    let audio = new Audio('alamar.mp3');
    let ultimaVez

    function preload() {
        bodyPose = ml5.bodyPose();
    }

    function setup() {
        createCanvas(640, 480);

        // Create the video and hide it
        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();

        // Start detecting poses in the webcam video
        bodyPose.detectStart(video, gotPoses);
        // Get the skeleton connection information
        connections = bodyPose.getSkeleton();
    }

    function draw() {
        // Draw the webcam video
        image(video, 0, 0, width, height);

        dibujarEsqueletoPersona()
        dibujarProgreso()
    }

    let played = false;
    let shouldPlay = false;

    function dibujarProgreso() {
        if (shouldPlay && !played){
            audio.play();
            played = true;
        }
        fill(255)
        rect(0, height - 20, width, 15)

        //un map para traducir el tiempo en un rectangulo
        const r = map(Date.now(), ultimaVez, ultimaVez + 5000, 0, width)


        console.log(r);

        if (ultimaVez !== 0) {
            fill(0)
            rect(0, height - 20, r, 15)
            if (r >= width) {
                shouldPlay = true;
            }
        }
    }

    function dibujarEsqueletoPersona() {
        // Draw the skeleton connections
        for (let i = 0; i < poses.length; i++) {
            let pose = poses[i];
            for (let j = 0; j < connections.length; j++) {
                let pointAIndex = connections[j][0];
                let pointBIndex = connections[j][1];
                let pointA = pose.keypoints[pointAIndex];
                let pointB = pose.keypoints[pointBIndex];
                // Only draw a line if both points are confident enough
                if (pointA.confidence > 0.1 && pointB.confidence > 0.1) {
                    stroke(255, 0, 0);
                    strokeWeight(2);
                    line(pointA.x, pointA.y, pointB.x, pointB.y);
                }
            }
        }

        // Draw all the tracked landmark points
        for (let i = 0; i < poses.length; i++) {
            let pose = poses[i];
            for (let j = 0; j < pose.keypoints.length; j++) {
                let keypoint = pose.keypoints[j];
                // Only draw a circle if the keypoint's confidence is bigger than 0.1
                if (keypoint.confidence > 0.1) {
                    fill(0, 255, 0);
                    noStroke();
                    circle(keypoint.x, keypoint.y, 10);
                }
            }
        }
    }

    function gotPoses(results) {
        // Save the output to the poses variable
        poses = results;

        //guardamos la ultima vez que se detecto una persona
        if (results?.length > 0) {
            if (ultimaVez === 0) {
                ultimaVez = Date.now()
            }
        } else {
            ultimaVez = 0
            shouldPlay = false;
            played = false;
        }
    }

</script>
<script src="navbar.js"></script>

    whereAmI("case5");
</script>
</body>
</html>
