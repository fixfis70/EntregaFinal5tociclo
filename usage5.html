<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>

    <!-- ML5.js (ML) - Última versión -->
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <link rel="stylesheet" href="elCss.css">
</head>
<body>
<div id="root">
    <div>
        <h1>Caso 5</h1>
        <p>Utilizando el detector de objetos de la librería ML5, emitir una alerta cuando detecte la presencia de una persona por más de 5 segundos. Se deberá mostrar una barra de desplazamiento durante el conteo, si llega a 5, la alarma se emite (sonora).</p>
    </div>
</div>
<script>
    let video;
    //let bodyPose;
    let detections = []
    let model
    let poses = [];
    let audio = new Audio('alamar.mp3');
    let ultimaVez = 0

    function preload() {
        //bodyPose = ml5.bodyPose();
        model = ml5.objectDetection("cocossd");
    }

    function setup() {
        const canvas = createCanvas(640, 480);
        canvas.parent('root');

        // Create the video and hide it
        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();

        model.detectStart(video, gotResult);
    }

    function draw() {
        // Draw the webcam video
        image(video, 0, 0, width, height);

        //dibujarEsqueletoPersona()
        dibujarProgreso()
        dibujarDectecion()
    }

    let played = false;
    let shouldPlay = false;

    function dibujarDectecion() {

        for (let i = 0; i < detections.length; i += 1) {
            let detection = detections[i];

            // Draw bounding box
            stroke(0, 255, 0);
            strokeWeight(4);
            noFill();
            rect(detection.x, detection.y, detection.width, detection.height);

            // Draw label
            noStroke();
            fill(255);
            textSize(24);
            text(detection.label, detection.x + 10, detection.y + 24);
        }
    }
    function dibujarProgreso() {
        if (shouldPlay && !played){
            audio.play();
            played = true;
        }
        fill(255)
        rect(0, height - 20, width, 15)

        //un map para traducir el tiempo en un rectangulo
        const r = map(Date.now(), ultimaVez, ultimaVez + 5000, 0, width)


        console.log(r);

        if (ultimaVez !== 0) {
            fill(0)
            rect(0, height - 20, r, 15)
            if (r >= width) {
                shouldPlay = true;
            }
        }
    }

    function gotResult(results) {
        detections = results;
        if (results?.length > 0) {
            for (let i = 0; i < detections.length; i++) {
                const detection = detections[i];
                if (detection.label === "person") {
                    if (ultimaVez === 0) {
                        console.log("go");
                        ultimaVez = Date.now()
                    }
                }
            }
        } else {
            ultimaVez = 0
            shouldPlay = false;
            played = false;
        }
    }
</script>
<script src="navbar.js"></script>
<script>
    whereAmI("case5");
</script>
</body>
</html>
