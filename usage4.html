<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>

    <!-- ML5.js (ML) - Última versión -->
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>
<div>Teachable Machine Image Model - p5.js and ml5.js</div>
<script type="text/javascript">
    // Classifier Variable
    let classifier;
    // Model URL
    let imageModelURL = 'https://teachablemachine.withgoogle.com/models/rCpuszYH_/';

    // Video
    let video;
    // To store the classification
    let modelResult = "";
    let label = "";
    let confidence = 0;

    // Load the model first
    function preload() {
        classifier = ml5.imageClassifier(imageModelURL + 'model.json');
    }

    function setup() {
        createCanvas(640, 480);
        // Create the webcam video and hide it
        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();
        // Start classifying
        classifyVideo();
    }

    function draw() {
        background(0);
        // Draw the video
        image(video, 0, 0);

        // Draw the label
        fill(255);
        textSize(16);
        textAlign(CENTER);
        text(label, width / 2, height - 4);
        text(confidence, width / 2, height - 12);
    }

    function classifyVideo() {
        classifier.classifyStart(video, gotResult);
    }


    //Tomamos un tiempo para poder esperar 1 segundo (si no el se llena la cola de speech)
    let lastExecutionTime = 0;

    function gotResult(results) {
        if (!results || results.length === 0) {
            console.error("Eroro");
            return;
        }

        const result = results[0];
        confidence = result.confidence;

        //Verificamos el tiempo y guardamos hora
        const now = Date.now();
        if (now - lastExecutionTime < 1000) {
            return;
        }
        lastExecutionTime = now;

        //mas de 80% para evitar falsos reconocimientos
        if (result.confidence > 0.8) {
            const currentResult = result.label;

            if (currentResult !== modelResult) {
                label = modelResult = currentResult;
                // el speech sacado de https://lenguajejs.com/javascript/web-apis/speechsynthesis/
                const message = new SpeechSynthesisUtterance(currentResult);
                speechSynthesis.speak(message);
            }

        } else {
            if (modelResult !== "No encontrado") {
                label = "No encontrado";
            }
        }
        console.log(result);
    }
</script>

</body>
</html>
